# Example: how a team would plug PipelineDoctor into THEIR pipeline.
# The build runs through `pipelinedoctor run`: network blips are retried automatically,
# and any other failure is diagnosed in the GitHub Actions job summary.
# (This file is an example; copy it to .github/workflows/ in a project that has a real build.)

name: Build with PipelineDoctor

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PipelineDoctor
        run: pip install git+https://github.com/Praneshragavendar/pipeline-doctor.git

      - name: Build (self-healing)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: AI investigation of unknown failures
        run: pipelinedoctor run --max-retries 2 --github-summary -- mvn -B package
