name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint rules and knowledge base
        run: pipelinedoctor lint --strict

      - name: Run unit and stress tests
        run: pytest -v --junitxml=reports/unit-tests.xml

      - name: Smoke test with the Bash wrapper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/diagnose.sh sample_logs/azure_msvc_toolset.log sample_logs/agent_ssl_registration.log

      - name: Smoke test with the PowerShell wrapper (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\diagnose.ps1 sample_logs\azure_msvc_toolset.log sample_logs\powershell_and_operator.log

      - name: JUnit XML report of sample diagnoses
        run: pipelinedoctor analyze sample_logs/gha_pytest_failure.log sample_logs/docker_disk_full.log --no-llm --format junit

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pipelinedoctor:ci .
      - name: Run container on a sample log
        run: docker run --rm -v "$PWD/sample_logs:/logs" pipelinedoctor:ci analyze /logs/docker_disk_full.log --no-llm

  agent:
    # Proves the agentic features end to end on a real (free, local) LLM - no API key needed.
    name: AI agent on a local LLM (Ollama) + self-healing run
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    env:
      PIPELINEDOCTOR_LLM: ollama
      # 7B gives much better diagnoses than 3B; CI has the RAM for it (on a laptop, 3B is the default).
      PIPELINEDOCTOR_OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PipelineDoctor
        run: pip install -e .

      - name: Self-healing run (a network blip is retried automatically)
        run: >
          pipelinedoctor run --backoff 2 --no-llm --github-summary
          -- python scripts/flaky_build.py "$RUNNER_TEMP/flaky_marker"

      - name: Cache the model download
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.PIPELINEDOCTOR_OLLAMA_MODEL }}

      - name: Install Ollama and download the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "$PIPELINEDOCTOR_OLLAMA_MODEL"
          ollama list

      - name: Agent investigates failures that no rule covers
        run: |
          mkdir -p agent-results
          for log in sample_logs/terraform_state_lock.log sample_logs/unknown_custom_tool.log; do
            name=$(basename "$log" .log)
            echo "::group::$name"
            time pipelinedoctor analyze "$log" --format json --github-summary > "agent-results/$name.json"
            echo "::endgroup::"
          done

      - name: Check the agent really investigated
        run: |
          python - <<'PY'
          import json
          for name in ("terraform_state_lock", "unknown_custom_tool"):
              d = json.load(open(f"agent-results/{name}.json"))
              steps = [s["action"] for s in d["agent_trace"]]
              print(f"{name}: source={d['source']} status={d['status']} confidence={d['confidence']} steps={steps}")
              print(f"  cause: {d['cause']}")
              for hint in d["fix_hints"]:
                  print(f"  fix: {hint}")
              assert d["status"] == "diagnosed", f"{name} was not diagnosed"
              assert d["source"] in ("agent", "llm"), f"{name}: no LLM diagnosis"
          assert json.load(open("agent-results/terraform_state_lock.json"))["source"] == "agent"
          PY

      - name: Upload agent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-results
          path: agent-results/
