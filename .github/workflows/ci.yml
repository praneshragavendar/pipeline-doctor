name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint rules and knowledge base
        run: pipelinedoctor lint --strict

      - name: Run unit and stress tests
        run: pytest -v --junitxml=reports/unit-tests.xml

      - name: Smoke test with the Bash wrapper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/diagnose.sh sample_logs/azure_msvc_toolset.log sample_logs/agent_ssl_registration.log

      - name: Smoke test with the PowerShell wrapper (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\diagnose.ps1 sample_logs\azure_msvc_toolset.log sample_logs\powershell_and_operator.log

      - name: JUnit XML report of sample diagnoses
        run: pipelinedoctor analyze sample_logs/gha_pytest_failure.log sample_logs/docker_disk_full.log --no-llm --format junit

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pipelinedoctor:ci .
      - name: Run container on a sample log
        run: docker run --rm -v "$PWD/sample_logs:/logs" pipelinedoctor:ci analyze /logs/docker_disk_full.log --no-llm
